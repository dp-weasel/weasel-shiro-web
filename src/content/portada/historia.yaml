# "Cómo empezó todo": la historia del canal.

titulo: Cómo empezó todo

presenta:
  quien: armino
  texto: "¿Querés saber cómo empezó todo esto? Te cuento, que yo estaba ahí."

parrafos:
  - "Weasel es argentino y un día se animó a prender la cámara. Su primer directo fue a mediados de junio de 2025, casi sin saber nada de OBS, y fue armando el canal de a poco: las escenas, la música, los personajes (yo incluido)… todo hecho a mano, con un poco de ayuda de la IA 😅."
  - "¿Por qué Weasel Shiro? Weasel es el nombre que usó siempre en internet y es como lo conocen todos sus amigos. ¿Y Shiro? Lo malo de los nombres cortos y sencillos es que siempre los tiene alguien más y es fácil que te confundan, así que básicamente lo eligió porque estaba disponible y le gustó cómo suena 😆."
  - "Lo que siempre le gustó de Guild Wars 2 es su lado sociable: tener a alguien con quien charlar, ayudar a los nuevos a entender el juego o a conseguir algún logro… Por eso se animó a crear este canal: para llegar a más gente, ayudar a los que recién arrancan o quieren avanzar con el endgame, y divertirnos entre todos."

