# "Escribí y pasa algo": lo que pasa según lo que se escriba en el chat de Twitch.
#   - Los que contesta el bot de Streamlabs (Cloudbot) responden en el chat.
#   - Los demás pasan en pantalla, en el directo (ObsScenes: shared/reacciones.js y overlays/stickers/).
#   etiqueta: opcional; marca los que todavía no existen (p. ej. idea).
# Ojo: los comandos que empiezan con ! van entre comillas.

titulo: Escribí y pasa algo

presenta:
  quien: edm
  pose: hiss
  texto: "Si escribís !edm, contesto. Si nombrás al Armiño, se asoma. No me provoques."

comandos:
  - comando: "!stickers"
    que_hace: "El bot te pasa en el chat la lista de palabras que hacen aparecer a EDM."
  - comando: jaja, F, vamos…
    que_hace: "Las palabras de los stickers hacen aparecer a EDM en pantalla con esa pose (ver arriba)."
  - comando: "!edm"
    que_hace: "EDM te contesta en pantalla con una frase al azar."
  - comando: armiño
    que_hace: "Nombrá al Armiño y se asoma desde abajo de la pantalla."
  - comando: tu primer mensaje
    que_hace: "EDM te saluda por tu nombre la primera vez que hablás."
  - comando: "!redes"
    que_hace: "El bot te pasa en el chat dónde más encontrar a Weasel."
  - comando: "!donar"
    que_hace: "Cómo bancar el canal: Cafecito desde Argentina o PayPal desde el exterior."
  - comando: "!lurk"
    que_hace: "Avisá que mirás de fondo. Cuenta igual, y mucho."
